<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Classroom: class chat</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/cr.css"></head><body>
<script src="../assets/cr.js"></script>
<script>
const msg = (who, text, tag = '', teacher = false) => `<div class="msg">${av(who, 44, teacher ? '#FFD44D' : '')}<div><b>${teacher ? 'Ms. Asha' : who}</b>${text}${tag}</div></div>`;
CR.mount({
  title: 'Present simple: he, she, it', step: { n: 3, total: 5 },
  teacher: { state: 'speaking', say: 'Listen carefully. Then say A, B, C or D.' },
  rail: { timer: { p: 62, text: '0:24' }, now: { name: 'Diya', state: 'Your turn', tone: 'chalk' }, queue: ['Kabir', 'Meera', 'Rohan'], here: 18 },
  dock: { icon: 'ear', status: 'Say A, B, C or D, or tap an option', wave: 'calm', type: true, mic: '' },
  board: `<span class="eyebrow">${ic('check', 22)}Choose the right answer</span>
    <h1>Which sentence is correct?</h1>
    <div class="opts mid"><div class="opt"><span class="k">A</span>He go home.</div><div class="opt"><span class="k">B</span>He goes home.</div><div class="opt"><span class="k">C</span>He going home.</div><div class="opt"><span class="k">D</span>He gose home.</div></div>`,
  drawer: `<aside class="drawer"><header>Class chat<button class="tool">${ic('x')}</button></header><div style="overflow:hidden">
    ${msg('Asha', 'Which sentence is correct? A, B, C or D.', '', true)}
    ${msg('Kabir', 'B. He goes home.', '<div><span class="chip mint tag">Right</span></div>')}
    ${msg('Asha', 'Spot on! With he, she and it, the verb takes -es.', '', true)}
    ${msg('Meera', 'She go to school every day.', '<div><span class="chip coral tag">1 fix</span></div>')}
    ${msg('Asha', 'Good try! Say it like this: She goes to school every day.', '', true)}
    ${msg('Rohan', 'My sister plays tennis on Sunday.', '<div><span class="chip mint tag">No mistakes</span></div>')}</div></aside>`,
});
</script></body></html>
